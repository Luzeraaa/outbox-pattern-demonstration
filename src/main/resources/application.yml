spring:
  application:
    name: outbox-pattern-demonstration

  # ATENÇÃO: "spring.data.mongodb.*" foi depreciado (nível error) a partir do
  # Spring Boot 4.0 em favor de "spring.mongodb.*" — usar o namespace antigo
  # faz cair silenciosamente no default localhost:27017.
  mongodb:
    # Replica-set single-node — necessário para transação multi-documento
    # (Proposta + OutboxEvent na mesma transação Mongo, ver CLAUDE.md).
    # O host "mongo" resolve via DNS interno do docker-compose.
    # serverSelectionTimeoutMS reduzido do default do driver (30s) para 5s:
    # com Mongo indisponível, cada tentativa do Circuit Breaker/Retry (MVP 4)
    # ou do Scheduler (MVP 3) esperaria 30s antes de falhar - inaceitável
    # tanto pra demo quanto pra latência real de detecção de falha.
    uri: mongodb://mongo:27017/outbox_demo?replicaSet=rs0&serverSelectionTimeoutMS=5000

  kafka:
    bootstrap-servers: kafka:29092

server:
  port: 8080

management:
  endpoint:
    health:
      # "always" expõe o detalhe de cada health indicator (Mongo, disco, etc.)
      # — útil na demo para mostrar que o healthcheck do compose é real, não
      # um "fake ping".
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

outbox:
  scheduler:
    # Rollback (ver CLAUDE.md, roadmap MVP 3): false desliga só a rede de
    # segurança, o fluxo síncrono de criação continua funcionando normalmente.
    enabled: true
    fixed-delay-ms: 5000
    # Quanto tempo um claim (EM_PROCESSAMENTO) fica válido antes de ser
    # considerado abandonado (instância que reivindicou provavelmente crashou).
    claim-ttl-segundos: 30
    # Um PENDENTE de 1ª tentativa só fica elegível pro Scheduler depois de
    # "envelhecer" esse tanto - dá tempo do fast-path pós-commit terminar
    # antes do Scheduler competir pelo mesmo registro e publicar duplicado.
    grace-period-segundos: 6
    # Limite antes de ir para FALHA_DEFINITIVA - evita retry infinito de
    # "poison message".
    max-tentativas: 5
    backoff-base-segundos: 5
    backoff-max-segundos: 300

proposta:
  listener:
    # Rollback (ver CLAUDE.md, roadmap MVP 4): false desliga só o consumo,
    # a publicação (fast-path/Scheduler) continua funcionando normalmente.
    enabled: true

resilience4j:
  retry:
    instances:
      processar-proposta:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      processar-proposta:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Ordena por método HTTP para facilitar achar o endpoint durante a demo
    # ao vivo, quando a lista de endpoints crescer nos próximos MVPs.
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
